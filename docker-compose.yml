services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backup:
    image: mysql:8
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    entrypoint: >
      bash -c '
      until mysqladmin ping -h db -uroot -p${MYSQL_ROOT_PASSWORD} --silent; do
        echo "Waiting for MySQL..."
        sleep 2
      done

      while true; do
        FILE=/backups/craiova_$$(date +%F_%H-%M-%S).sql

        echo "Creating backup: $$FILE"

        if mysqldump -h db -uroot -p${MYSQL_ROOT_PASSWORD} craiova > "$$FILE"; then
          echo "Backup successful"
        else
          echo "Backup FAILED"
          rm -f "$$FILE"
        fi

        sleep 3600
      done
      '
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  scraper:
    build: ./scraper
    depends_on:
      - db
    volumes:
      - ./backend:/shared-backend
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
volumes:
  db_data:
