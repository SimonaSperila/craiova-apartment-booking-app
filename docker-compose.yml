services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: craiova
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  backup:
    image: mysql:8
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    entrypoint: >
      bash -c '
      until mysqladmin ping -h db -uroot -proot --silent; do
        echo "Waiting for MySQL..."
        sleep 2
      done

      while true; do
        FILE=/backups/craiova_$$(date +%F_%H-%M-%S).sql

        echo "Creating backup: $$FILE"

        if mysqldump -h db -uroot -proot craiova > "$$FILE"; then
          echo "Backup successful"
        else
          echo "Backup FAILED"
          rm -f "$$FILE"
        fi

        sleep 3600
      done
      '
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  scraper:
    build: ./scraper
    depends_on:
      - db
    volumes:
      - ./backend:/shared-backend
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: userpass
      DB_NAME: craiova
volumes:
  db_data: