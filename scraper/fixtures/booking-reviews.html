<!-- Minimal stand-in for Booking.com's reviews tab markup: same data-testid
     hooks and nesting depth that extractReviews/extractOverallScore rely on. -->
<div data-testid="reviews-tab-score-header">
  <div>
    <div>Guests say</div>
    <div>9.2</div>
    <div>·</div>
    <div>
      <div>Wonderful</div>
      <div>128 reviews</div>
    </div>
  </div>
</div>

<div data-testid="review-list-container">
  <div data-testid="review-card">
    <div data-testid="review-avatar">
      <div>
        <div><img alt="avatar" /></div>
        <div>
          <div>Alex</div>
          <div><span>Romania</span></div>
        </div>
      </div>
    </div>
    <div data-testid="review-score">
      <div>
        <div>Score</div>
        <div>10</div>
      </div>
    </div>
    <div data-testid="review-positive-text">Great location, very clean.</div>
    <div data-testid="review-negative-text">Nothing.</div>
  </div>

  <div data-testid="review-card">
    <div data-testid="review-avatar">
      <div>
        <div><img alt="avatar" /></div>
        <div>
          <div>Maria</div>
          <div><span>Bulgaria</span></div>
        </div>
      </div>
    </div>
    <div data-testid="review-score">
      <div>
        <div>Score</div>
        <div>8,5</div>
      </div>
    </div>
    <div data-testid="review-positive-text">Comfortable bed.</div>
    <div data-testid="review-negative-text"></div>
  </div>
</div>
